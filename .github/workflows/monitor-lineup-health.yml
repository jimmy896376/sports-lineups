name: Monitor lineup feed health

on:
  schedule:
    - cron: '10,25,40,55 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Test monitor rules
        run: node scripts/nude/health.test.mjs
      - name: Check current feed
        id: health
        env:
          NUDE_LINEUP_LIVE_URL: https://bulltv24.com/api/lineups/bull-feed.json
        run: node scripts/nude/health.mjs --live
      - name: Retry collection after a failed check
        if: failure() && steps.health.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          running=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow refresh-lineups.yml --status in_progress --json databaseId --jq length)
          queued=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow refresh-lineups.yml --status queued --json databaseId --jq length)
          if [ "$running" -eq 0 ] && [ "$queued" -eq 0 ]; then
            gh workflow run refresh-lineups.yml --repo "$GITHUB_REPOSITORY" --ref main
          fi
      - name: Close health alert after recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 50 --json number,title --jq '[.[] | select(.title == "Lineup feed health check failure") | .number][0] // empty')
          if [ -n "$issue" ]; then
            gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --comment "Lineup health recovered: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
      - name: Notify owner of health check failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 50 --json number,title --jq '[.[] | select(.title == "Lineup feed health check failure") | .number][0] // empty')
          if [ -z "$issue" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Lineup feed health check failure" --assignee "$GITHUB_REPOSITORY_OWNER" --body "Lineup feed health check failed. Inspect the run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
