name: Publish Nude lineup feed

on:
  push:
    branches: [main]
    paths: ['dist/**', 'scripts/**', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-nude-feed
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and publish current source atomically
        run: bash scripts/nude/publish.sh
