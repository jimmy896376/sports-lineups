name: Publish Nude lineup feed

on:
  push:
    branches: [main]
    paths: ['dist/**', 'scripts/**', '.github/workflows/**']
  workflow_run:
    workflows: ['Refresh lineup projections', 'Publish reviewed full names', 'Refresh published match probabilities']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-nude-feed
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and publish current source atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            # Disposable CI checkout only. Rebuild on fresh main after any race.
            git fetch origin main
            git reset --hard origin/main
            node scripts/nude/test.mjs
            node scripts/nude/export.mjs
            git add -- dist/nude-feed.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'chore: publish Nude lineup feed'
            if git push origin HEAD:main; then exit 0; fi
          done
          echo 'Publish raced with upstream or branch protection blocked it; previous feed retained.' >&2
          exit 1
