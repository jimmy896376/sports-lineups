name: Refresh lineup projections

on:
  push:
    branches: [main]
    paths:
      - 'scripts/update-projections.py'
      - 'scripts/publish-generated.sh'
      - 'scripts/test_npb_schedule.py'
      - 'scripts/test_starting_pitchers.py'
      - 'scripts/test_injury_reports.py'
      - 'scripts/test_wkbl_schedule.py'
      - 'scripts/test_kbl_lineups.py'
      - 'scripts/test_team_logos.py'
      - 'scripts/recent_form.py'
      - 'scripts/test_recent_form.py'
      - 'scripts/starting-pitcher-review.json'
      - 'scripts/check-player-names.mjs'
      - 'scripts/collect-player-names.mjs'
      - 'scripts/player-name-exceptions.json'
      - 'dist/player-ko.js'
      - 'dist/team-ko.json'
      - 'scripts/team-name-review.json'
      - 'scripts/player-name-review.json'
      - 'scripts/player-name-source-review.json'
      - 'scripts/build-name-catalog.mjs'
      - 'dist/football-ko.js'
      - 'dist/app.js'
      - 'dist/win-probability.js'
      - 'scripts/check-win-probability.mjs'
      - '.github/workflows/refresh-lineups.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-lineups
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate NPB published start times
        run: python3 scripts/test_npb_schedule.py
      - name: Validate announced starting pitchers
        run: python3 scripts/test_starting_pitchers.py
      - name: Validate injury team mapping
        run: python3 scripts/test_injury_reports.py
      - name: Validate WKBL official schedule times
        run: python3 scripts/test_wkbl_schedule.py
      - name: Validate KBL projected starters
        run: python3 scripts/test_kbl_lineups.py
      - name: Validate team logo mapping
        run: python3 scripts/test_team_logos.py
      - name: Validate ESPN recent form matching
        run: python3 scripts/test_recent_form.py
      - name: Fetch current lineup projections
        run: python3 scripts/update-projections.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate game outcome estimates
        run: node scripts/check-win-probability.mjs
      - name: Build current Korean name catalog
        run: node scripts/build-name-catalog.mjs
      - name: Audit Korean names across all leagues
        run: node scripts/check-player-names.mjs --audit
      - name: Collect names from live lineup and injury renderers
        run: node scripts/collect-player-names.mjs --allow-partial
      - name: Add verified aliases for observed provider spellings
        run: node scripts/build-name-catalog.mjs
      - name: Audit live player names
        run: node scripts/check-player-names.mjs --inventory scripts/player-name-live-inventory.json
      - name: Prepare unreviewed name search queue
        if: always()
        run: node scripts/build-name-catalog.mjs --queue
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: player-name-audit
          path: |
            scripts/player-name-audit.json
            scripts/player-name-live-audit.json
            scripts/player-name-live-inventory.json
            scripts/team-name-live-audit.json
            scripts/name-review-queue.json
          retention-days: 3
      - name: Commit lineup changes
        run: |
          bash scripts/publish-generated.sh 'chore: refresh lineups' dist/projections.json
