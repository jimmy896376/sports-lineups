name: Refresh Scorebase lineups

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-scorebase-lineups
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 scripts/test_scorebase_lineups.py
      - run: python3 scripts/scorebase_lineups.py
      - run: bash scripts/publish-generated.sh 'chore: refresh Scorebase confirmed lineups' dist/scorebase-lineups.json
